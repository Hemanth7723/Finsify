name: Release Finsify APK and Deploy Web

on:
  push:
    branches: 
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-and-web:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Android APK
      - name: Build Android APK
        run: flutter build apk --release

      - name: Copy Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release_artifacts/Finsify_${GITHUB_REF_NAME}.apk"

      # Flutter Web
      - name: Build Flutter Web
        run: |
          flutter build web --release \
            --base-href "/${GITHUB_REPOSITORY#*/}/"

      - name: Verify Web Build
        shell: bash
        run: |
          set -euo pipefail
          test -f build/web/index.html
          touch build/web/.nojekyll

      # GitHub Pages artifact
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      # Android GitHub Release
      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/*.apk
          draft: false
          prerelease: false

  deploy-web:
    runs-on: ubuntu-latest
    needs: build-android-and-web

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
