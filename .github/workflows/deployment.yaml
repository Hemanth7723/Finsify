name: Release Finsify APK and IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Copy Android APK to release artifact
        run: |
          mkdir -p release_artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "release_artifacts/Finsify_${{ github.ref_name }}.apk"

      - name: Build iOS IPA
        run: flutter build ipa --release --no-codesign

      - name: Copy iOS IPA to release artifact
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "IPA not found"
            exit 1
          fi
          cp "$IPA_PATH" "release_artifacts/Finsify_${{ github.ref_name }}.ipa"

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_artifacts/Finsify_${{ github.ref_name }}.apk
            release_artifacts/Finsify_${{ github.ref_name }}.ipa
          draft: false
          prerelease: false
