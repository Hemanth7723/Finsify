name: Release Finsify APK, unsigned iOS IPA, and Deploy Web

on:
  push:
    branches: 
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-and-web:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Android APK
      - name: Build Android APK
        run: flutter build apk --release --split-per-abi

      - name: Copy Android APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_artifacts
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="${apk##*/app-}"
            abi="${abi%-release.apk}"
            cp "$apk" "release_artifacts/Finsify_${GITHUB_REF_NAME}_${abi}.apk"
          done

      # Unsigned iOS IPA (build the app bundle without signing, then package as IPA)
      - name: Build unsigned iOS app bundle
        run: flutter build ios --release --no-codesign

      - name: Package unsigned iOS IPA
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "Unsigned iOS app bundle not found at build/ios/iphoneos/Runner.app"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent \
            "build/ios/iphoneos/Runner.app" \
            "release_artifacts/Finsify_${GITHUB_REF_NAME}_unsigned.ipa"

      # Flutter Web
      - name: Build Flutter Web
        run: |
          flutter build web --release \
            --base-href "/${GITHUB_REPOSITORY#*/}/"

      - name: Verify Web Build
        shell: bash
        run: |
          set -euo pipefail
          test -f build/web/index.html
          touch build/web/.nojekyll

      # GitHub Pages artifact
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      # Android GitHub Release
      - name: Create GitHub Release and upload APK + unsigned iOS IPA
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_artifacts/*.apk
            release_artifacts/*.ipa
          body: |
            Download the APK that matches your Android device. Most modern Android phones use `arm64-v8a`.
            `armeabi-v7a` is for 32-bit ARM devices; `x86_64` is mainly for emulators and x86 devices.
          draft: false
          prerelease: false

  deploy-web:
    runs-on: ubuntu-latest
    needs: build-android-and-web

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
